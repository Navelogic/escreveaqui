spring.application.name=backend

spring.threads.virtual.enabled=true

server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=1024

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:escreveaqui}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=EscreveAquiPool

cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

spring.cache.type=caffeine
spring.cache.cache-names=notas
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=30s

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=${spring.application.name}

logging.structured.format.console=ecs
